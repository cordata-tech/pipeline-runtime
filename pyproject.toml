[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cordata-pipeline-runtime"
version = "0.2.0"
description = "Runnable reference implementation of the descriptor-driven pipeline executor"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Cordata", email = "hello@cordata.tech" }]
# The base install is the descriptor model, the policy resolution and the
# example data — what a tool reading the model needs (catalog-mcp,
# cordata-tech/platform#26). Running a pipeline needs the `run` extra.
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6",
]

[project.optional-dependencies]
run = [
    "duckdb>=1.1",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=16",
    "great_expectations>=1.0",
    "openlineage-python>=1.20",
]
test = ["cordata-pipeline-runtime[run]", "pytest>=8"]
dev = ["cordata-pipeline-runtime[run]", "pytest>=8", "ruff>=0.6"]

[project.scripts]
pipeline-runtime = "pipeline_runtime.__main__:main"

[project.urls]
Homepage = "https://cordata.tech"
Source = "https://github.com/cordata-tech/pipeline-runtime"
Changelog = "https://github.com/cordata-tech/pipeline-runtime/blob/main/CHANGELOG.md"
Issues = "https://github.com/cordata-tech/pipeline-runtime/issues"
"Part 1" = "https://cordata.tech/en/blog/pipelines-as-descriptors"
"Part 2" = "https://cordata.tech/en/blog/pipeline-half-openlineage-gx"

[tool.setuptools]
packages = ["pipeline_runtime", "pipeline_runtime.backends", "pipeline_runtime.example"]

# `example/` is mapped into the wheel where it already is, not copied into
# `src/`: its descriptors are byte-identical to the published ones, and a second
# copy would be one more thing to keep in step. The seeded catalog and warehouse
# are generated and git-ignored, so they stay out.
[tool.setuptools.package-dir]
"" = "src"
"pipeline_runtime.example" = "example"

[tool.setuptools.package-data]
"pipeline_runtime.example" = ["ontology.json", "domains/**/*", "proposals/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "tools"]
# Extracted from the published markdown at test time. Linting it would report
# the article's style, which is not this repo's to change.
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# UP042 wants `class OnFailure(StrEnum)`. It is right, and `descriptor.py` is
# the code published in part 1 § 3 — changing it here would make the repo and
# the article disagree over a detail neither depends on. Worth revisiting only
# if the article is revised.
ignore = ["UP042"]
