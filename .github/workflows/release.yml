name: Release

# Fires on a `v*` tag. The tag is the decision; everything here is mechanical.
#
# Publishes through a **trusted publisher** on PyPI for
# `cordata-tech/pipeline-runtime`, workflow `release.yml`, environment `pypi` —
# the same arrangement `qedro` uses. No API token anywhere: a repository whose
# part 2 publishes the commit behind its own provenance should not upload from a
# secret in a settings page. The `pypi` environment only accepts `v*` tags.
on:
  push:
    tags: ["v*"]
  # A dry run: everything except the upload, so the workflow can be proved before
  # a tag is pushed. A version number on PyPI cannot be used twice.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The tag, `pyproject.toml` and `pipeline_runtime.__version__` all state the
  # version. A release where they disagree is one nobody can reason about
  # afterwards, so it fails here rather than shipping.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      - name: The tag matches the version, in both places it is written
        if: github.event_name == 'push'
        run: |
          python - <<'PY'
          import os, sys, tomllib
          from importlib.metadata import version
          import pipeline_runtime
          tag = os.environ["GITHUB_REF_NAME"]
          declared = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          found = {"pyproject.toml": declared, "__version__": pipeline_runtime.__version__,
                   "installed": version("cordata-pipeline-runtime")}
          wrong = {k: v for k, v in found.items() if f"v{v}" != tag}
          if wrong:
              sys.exit(f"tag {tag} does not match {wrong}")
          print(f"{tag} matches {found}")
          PY

      - name: The changelog has a dated entry for it
        if: github.event_name == 'push'
        run: |
          python - <<'PY'
          import os, pathlib, sys
          version = os.environ["GITHUB_REF_NAME"].lstrip("v")
          lines = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8").splitlines()
          heading = next((l for l in lines if l.startswith(f"## {version}")), None)
          if heading is None:
              sys.exit(f"CHANGELOG.md has no entry for {version}")
          if "unreleased" in heading.lower():
              sys.exit(f"CHANGELOG.md still marks {version} as unreleased — date it")
          print(f"CHANGELOG.md documents {version}: {heading}")
          PY

      # The same checks CI runs, so a release is never less tested than a push.
      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Test
        run: pytest -q

      - name: The quickstart in the README still works
        run: |
          python -m tools.seed --clean
          python -m pipeline_runtime example/domains/fraud/pipelines/transactions_scored.yml
          python -m pipeline_runtime example/domains/policy/pipelines/claims_ingest.yml
          test -s out/lineage.ndjson

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*

      # Install the wheel into clean environments, away from the checkout. The
      # base install must carry the model, the policy and the example data
      # without the execution stack; the `run` extra must make the CLI work.
      # setuptools warns that the example's subdirectories are not declared as
      # packages and may one day stop including them — the domain comparison
      # below is what fails if that happens, rather than an empty release.
      - name: The base install carries the model, the policy and the example
        run: |
          python -m venv /tmp/base
          /tmp/base/bin/pip install dist/*.whl
          cd /tmp
          /tmp/base/bin/python - <<'PY'
          import os, sys
          from importlib.resources import files
          import pipeline_runtime
          from pipeline_runtime import descriptor, policy
          heavy = [m for m in ("duckdb", "pandas", "great_expectations") if m in sys.modules]
          assert not heavy, f"the model and policy imported {heavy}"
          assert "pipeline_runtime/example" in str(policy.ontology_path()), policy.ontology_path()
          packaged = sorted(p.name for p in (files("pipeline_runtime.example") / "domains").iterdir())
          expected = sorted(os.listdir(os.path.join(os.environ["GITHUB_WORKSPACE"], "example", "domains")))
          assert packaged == expected, f"wheel carries {packaged}, repository has {expected}"
          print("base install", pipeline_runtime.__version__, "carries", packaged)
          PY
          ! /tmp/base/bin/pipeline-runtime example.yml 2> /tmp/cli-err.txt
          grep -q 'cordata-pipeline-runtime\[run\]' /tmp/cli-err.txt

      - name: The run extra makes the CLI work
        run: |
          python -m venv /tmp/full
          WHEEL=$(ls dist/*.whl)
          /tmp/full/bin/pip install "${WHEEL}[run]"
          cd /tmp
          /tmp/full/bin/pipeline-runtime --help > /dev/null

      # The quickstart the README now opens with, from the wheel and away from
      # the checkout: a release whose own demo cannot run does not publish. The
      # test suite cannot cover this, because an editable install maps no
      # `pipeline_runtime.example` and so never reads the packaged descriptors.
      - name: The wheel can run its own demo, with no checkout
        run: |
          mkdir -p /tmp/demo
          cd /tmp/demo
          /tmp/full/bin/pipeline-runtime demo .
          test -s catalog.duckdb
          test -s out/lineage.ndjson
          test "$(grep -c '"eventType": *"COMPLETE"' out/lineage.ndjson)" = 3
          grep -q 'cordata://fraud' out/lineage.ndjson

      - name: And it refuses a directory that is somebody else's
        run: |
          mkdir -p /tmp/not-ours && touch /tmp/not-ours/thesis.pdf
          cd /tmp
          ! /tmp/full/bin/pipeline-runtime demo /tmp/not-ours 2> /tmp/demo-err.txt
          grep -q 'thesis.pdf' /tmp/demo-err.txt
          test ! -e /tmp/not-ours/catalog.duckdb

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    # Only a tag publishes. A manual run stops after the build, which is what
    # makes the dry run safe to use.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # trusted publishing; no API token anywhere
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
